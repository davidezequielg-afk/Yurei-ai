<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Yurei</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" class="idle">
    <header id="bar" title="Clic para abrir o cerrar">
      <span id="eye" class="eye"></span>
      <span id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span id="status">Yurei</span>
    </header>
    <section id="reply" hidden></section>
    <section id="panel" hidden>
      <nav id="tabs">
        <button data-tab="chat" title="Chat" class="on">💬</button>
        <button data-tab="today" title="Hoy">📅</button>
        <button data-tab="stats" title="Stats">📊</button>
        <button data-tab="clip" title="Portapapeles">📋</button>
        <button data-tab="apps" title="Apps">🧩</button>
        <button data-tab="soul" title="Alma y ajustes">⚙️</button>
        <button data-tab="power" title="Energía">⏻</button>
      </nav>
      <div id="views">
        <div id="chat" class="view">
          <div id="log"></div>
          <form id="chatForm"><input id="chatInput" placeholder="Escribe…" autocomplete="off"><button type="button" id="micBtn" title="Hablar (Ctrl+Shift+Espacio)">🎤</button><button title="Enviar">➤</button></form>
        </div>
        <div id="today" class="view" hidden></div>
        <div id="stats" class="view" hidden></div>
        <div id="clip" class="view" hidden></div>
        <div id="apps" class="view" hidden></div>
        <div id="soul" class="view" hidden></div>
        <div id="power" class="view" hidden></div>
      </div>
    </section>
  </div>
  <script src="wav.js"></script>
  <script src="vad.js"></script>
  <script src="app.js"></script>
</body>
</html>
