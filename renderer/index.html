<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Yurei</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" class="idle">
    <header id="bar" title="Clic para abrir o cerrar">
      <span id="eye" class="eye"></span>
      <span id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span id="status">Yurei</span>
    </header>
    <section id="reply" hidden></section>
    <section id="panel" hidden>
      <button id="gear" title="Ajustes">⚙️</button>
      <div id="widgets">
        <div class="widget" id="wYurei">
          <button id="orb" title="Hablar con Yurei"></button>
          <div id="wName">Yurei</div>
          <div id="wState">Toca para hablar</div>
        </div>
        <div class="widget" id="wTime">
          <div id="wClock">--:--</div>
          <div id="wDate"></div>
        </div>
        <div class="widget" id="wTodos">
          <h4>Pendientes</h4>
          <div id="wTodoCount">…</div>
          <ul id="wTodoList"></ul>
        </div>
      </div>
    </section>
  </div>
  <script src="wav.js"></script>
  <script src="vad.js"></script>
  <script src="app.js"></script>
</body>
</html>
